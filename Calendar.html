<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cal</title>
<style>
  :root{
    --bg:#000000;
    --fg:#c9d1c9;
    --dim:#5f6b5f;
    --accent:#7ee787;
    --today-bg:#7ee787;
    --today-fg:#0c0e0c;
    --weekend:#8fa3d1;
    --prompt:#7ee787;
    --holiday:#e8b64a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:"SFMono-Regular","Cascadia Code","Fira Code",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:15px;
    line-height:1.5;
  }
  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 16px;
  }
  .term{
    width:100%;
    max-width:560px;
  }
  .line{white-space:pre;}
  .prompt{color:var(--prompt);}
  .prompt .sep{color:var(--dim);}
  .path{color:var(--accent);}
  .cmd{color:var(--fg);}
  .cursor{
    display:inline-block;
    width:8px;
    height:1em;
    background:var(--accent);
    vertical-align:text-bottom;
    margin-left:2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .cal{
    margin-top:6px;
    margin-bottom:22px;
  }
  .cal-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .cal-title{
    color:var(--fg);
    letter-spacing:2px;
  }
  .cal-nav{
    color:var(--dim);
    font-size:13px;
  }
  .cal-nav button{
    background:none;
    border:none;
    color:var(--dim);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    padding:2px 6px;
  }
  .cal-nav button:hover{color:var(--accent);}
  .cal-nav button:focus-visible{outline:1px solid var(--accent);}

  table{
    border-collapse:collapse;
    width:100%;
  }
  th,td{
    text-align:right;
    padding:4px 8px;
    width:14.28%;
    font-variant-numeric:tabular-nums;
  }
  th{
    color:var(--dim);
    font-weight:normal;
    font-size:12px;
    text-transform:lowercase;
    padding-bottom:6px;
  }
  th.weekend{color:var(--dim);}
  td{color:var(--fg);}
  td.other-month{color:#31382e;}
  td.weekend:not(.other-month){color:var(--weekend);}
  td.today{
    position:relative;
    color:var(--today-fg);
  }
  td.today .num{
    background:var(--today-bg);
    padding:1px 6px;
    border-radius:2px;
  }
  td .num{padding:1px 6px;}
  td.holiday:not(.today){color:var(--holiday);}
  td.holiday .num{position:relative;}
  td.holiday:not(.today) .num::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-5px;
    transform:translateX(-50%);
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--holiday);
  }
  td.today.holiday .num{box-shadow:0 0 0 2px var(--holiday);}

  .footer{
    color:var(--dim);
    margin-top:4px;
  }
  .footer .accent{color:var(--accent);}

  .holidays{
    margin-top:22px;
    margin-bottom:22px;
  }
  .holidays-title{
    color:var(--dim);
    font-size:12px;
    margin-bottom:8px;
    letter-spacing:1px;
  }
  .holidays-title .accent{color:var(--accent);}
  .holiday-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .holiday-list li{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:3px 0;
    font-size:13px;
  }
  .holiday-list .hdate{color:var(--holiday);white-space:nowrap;}
  .holiday-list .hname{color:var(--fg);text-align:right;}
  .holiday-list .hdays{color:var(--dim);white-space:nowrap;font-size:12px;}
  .holidays-status{color:var(--dim);font-size:13px;}
  .holidays-status.error{color:#e5989b;}
</style>
</head>
<body>

  <div class="cal">
    <div class="cal-header">
      <span class="cal-title" id="calTitle">MONTH YYYY</span>
      <span class="cal-nav">
        <button id="prevBtn" aria-label="previous month">&lt; prev</button>
        <button id="todayBtn" aria-label="jump to today">today</button>
        <button id="nextBtn" aria-label="next month">next &gt;</button>
      </span>
    </div>
    <table id="calTable">
      <thead>
        <tr id="calDow"></tr>
      </thead>
      <tbody id="calBody"></tbody>
    </table>
  </div>

  <div class="line prompt">guest<span class="sep">@</span>local<span class="sep">:</span><span class="path">~</span><span class="sep">$</span> <span class="cmd">cal --holidays in</span></div>

  <div class="holidays">
    <div class="holidays-title">upcoming public holidays <span class="accent">·</span> india</div>
    <div id="holidaysStatus" class="holidays-status">loading…</div>
    <ul class="holiday-list" id="holidayList"></ul>
  </div>

  <div class="line prompt footer">guest<span class="sep">@</span>local<span class="sep">:</span><span class="path">~</span><span class="sep">$</span> <span class="cursor"></span></div>
</div>

<script>
(function(){
  var dowNames = ['sun','mon','tue','wed','thu','fri','sat'];
  var monthNames = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  var now = new Date();
  var view = { year: now.getFullYear(), month: now.getMonth() };
  var realToday = { year: now.getFullYear(), month: now.getMonth(), date: now.getDate() };

  var titleEl = document.getElementById('calTitle');
  var dowEl = document.getElementById('calDow');
  var bodyEl = document.getElementById('calBody');

  // date string 'YYYY-MM-DD' -> holiday name, populated from caldays API
  var holidayMap = {};

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function ymd(y, m, d){ return y + '-' + pad2(m + 1) + '-' + pad2(d); }

  function render(){
    titleEl.textContent = monthNames[view.month] + ' ' + view.year;

    dowEl.innerHTML = '';
    dowNames.forEach(function(d, i){
      var th = document.createElement('th');
      th.textContent = d;
      if(i === 0 || i === 6) th.className = 'weekend';
      dowEl.appendChild(th);
    });

    bodyEl.innerHTML = '';

    var firstOfMonth = new Date(view.year, view.month, 1);
    var startDow = firstOfMonth.getDay();
    var daysInMonth = new Date(view.year, view.month + 1, 0).getDate();
    var daysInPrevMonth = new Date(view.year, view.month, 0).getDate();

    var cells = [];
    for(var i = startDow - 1; i >= 0; i--){
      cells.push({ day: daysInPrevMonth - i, other: true });
    }
    for(var d = 1; d <= daysInMonth; d++){
      cells.push({ day: d, other: false });
    }
    while(cells.length % 7 !== 0){
      cells.push({ day: cells.length - (startDow + daysInMonth) + 1, other: true });
    }

    for(var w = 0; w < cells.length / 7; w++){
      var tr = document.createElement('tr');
      for(var c = 0; c < 7; c++){
        var cell = cells[w * 7 + c];
        var td = document.createElement('td');
        var span = document.createElement('span');
        span.className = 'num';
        span.textContent = cell.day;
        td.appendChild(span);

        var classes = [];
        if(cell.other) classes.push('other-month');
        if(c === 0 || c === 6) classes.push('weekend');
        if(!cell.other && view.year === realToday.year && view.month === realToday.month && cell.day === realToday.date){
          classes.push('today');
        }
        if(!cell.other && holidayMap[ymd(view.year, view.month, cell.day)]){
          classes.push('holiday');
          td.title = holidayMap[ymd(view.year, view.month, cell.day)];
        }
        td.className = classes.join(' ');
        tr.appendChild(td);
      }
      bodyEl.appendChild(tr);
    }
  }

  document.getElementById('prevBtn').addEventListener('click', function(){
    view.month--;
    if(view.month < 0){ view.month = 11; view.year--; }
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    view.month++;
    if(view.month > 11){ view.month = 0; view.year++; }
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', function(){
    view.year = realToday.year;
    view.month = realToday.month;
    render();
  });

  render();

  // ---- india public holidays via caldays.com API ----
  var statusEl = document.getElementById('holidaysStatus');
  var listEl = document.getElementById('holidayList');

  function daysUntil(dateStr){
    var target = new Date(dateStr + 'T00:00:00');
    var today = new Date(realToday.year, realToday.month, realToday.date);
    var diff = Math.round((target - today) / 86400000);
    if(diff === 0) return 'today';
    if(diff === 1) return 'tomorrow';
    return 'in ' + diff + 'd';
  }

  function loadHolidays(year){
    return fetch('https://caldays.com/api/holidays/in?year=' + year)
      .then(function(res){
        if(!res.ok) throw new Error('http ' + res.status);
        return res.json();
      });
  }

  Promise.all([
    loadHolidays(realToday.year),
    loadHolidays(realToday.year + 1)
  ]).then(function(results){
    var all = [];
    results.forEach(function(r){
      if(r && Array.isArray(r.holidays)) all = all.concat(r.holidays);
    });

    all.forEach(function(h){
      if(h && h.date && h.name) holidayMap[h.date] = h.name;
    });
    render();

    var todayStr = ymd(realToday.year, realToday.month, realToday.date);
    var upcoming = all
      .filter(function(h){ return h.date >= todayStr; })
      .sort(function(a, b){ return a.date < b.date ? -1 : 1; })
      .slice(0, 8);

    if(upcoming.length === 0){
      statusEl.textContent = 'no upcoming holidays found';
      return;
    }

    statusEl.style.display = 'none';
    listEl.innerHTML = '';
    upcoming.forEach(function(h){
      var li = document.createElement('li');
      var dateSpan = document.createElement('span');
      dateSpan.className = 'hdate';
      dateSpan.textContent = h.date;
      var nameSpan = document.createElement('span');
      nameSpan.className = 'hname';
      nameSpan.textContent = h.name;
      var daysSpan = document.createElement('span');
      daysSpan.className = 'hdays';
      daysSpan.textContent = daysUntil(h.date);
      li.appendChild(dateSpan);
      li.appendChild(nameSpan);
      li.appendChild(daysSpan);
      listEl.appendChild(li);
    });
  }).catch(function(err){
    statusEl.textContent = 'could not load holidays (' + err.message + ')';
    statusEl.className = 'holidays-status error';
  });
})();
</script>
</body>
</html>
